<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>がくしゅう用 とけい</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      background-color: #f0f8ff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 10px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: clamp(20px, 4.5vw, 28px);
      color: #0056b3;
    }

    /* 時計本体 */
    #clock-container {
      position: relative;
      width: min(82vw, 350px);
      height: min(82vw, 350px);
      background: #ffffff;
      border: 8px solid #ff9f43;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    /* 時間の数字 (1〜12) */
    .hour-number {
      position: absolute;
      width: 36px;
      height: 36px;
      text-align: center;
      line-height: 36px;
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: bold;
      color: #2c3e50;
      transform: translate(-50%, -50%);
    }

    /* 分の数字 (0, 5, 10...55) */
    .minute-number {
      position: absolute;
      width: 24px;
      height: 24px;
      text-align: center;
      line-height: 24px;
      font-size: clamp(11px, 2.8vw, 14px);
      font-weight: bold;
      color: #2e86de;
      transform: translate(-50%, -50%);
    }

    /* 1分刻みの目盛り線 */
    .tick-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 6px;
      background-color: #a4b0be;
      transform-origin: center bottom;
    }

    /* 5分ごとの太い目盛り線 */
    .tick-mark.major {
      width: 3px;
      height: 10px;
      background-color: #2e86de;
    }

    /* 中心点 */
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      background: #333;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    /* 針の共通スタイル */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 10px;
      z-index: 5;
      pointer-events: none;
    }

    /* 短針（時針・赤） */
    .hour-hand {
      width: 10px;
      height: 24%;
      background-color: #ff5252;
      transform: translateX(-50%) rotate(0deg);
    }

    /* 長針（分針・青） */
    .minute-hand {
      width: 6px;
      height: 37%;
      background-color: #2e86de;
      transform: translateX(-50%) rotate(0deg);
    }

    /* デジタル時計表示 */
    .digital-display {
      margin-top: 12px;
      font-size: 24px;
      font-weight: bold;
      background: #fff;
      padding: 6px 20px;
      border-radius: 30px;
      border: 3px solid #0056b3;
      min-width: 170px;
      text-align: center;
      color: #0056b3;
    }

    /* 操作ボタンエリア */
    .controls {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 350px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
      transition: transform 0.1s;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .btn-realtime { background-color: #10ac84; color: white; }
    .btn-toggle { background-color: #54a0ff; color: white; }
    .btn-step { background-color: #ff9f43; color: white; }
  </style>
</head>
<body>

  <h1>とけいの がくしゅう</h1>

  <div id="clock-container">
    <div id="dial-layer"></div>
    <div id="hour-hand" class="hand hour-hand"></div>
    <div id="minute-hand" class="hand minute-hand"></div>
    <div class="center-dot"></div>
  </div>

  <div id="digital-text" class="digital-display">12じ 00ふん</div>

  <div class="controls">
    <div class="btn-group">
      <button class="btn btn-realtime" onclick="setRealTime()">いまの じかん</button>
      <button class="btn btn-toggle" onclick="toggleDigital()">こたえを かくす</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-step" onclick="addMinutes(-15)">- 15ふん</button>
      <button class="btn btn-step" onclick="addMinutes(15)">+ 15ふん</button>
    </div>
  </div>

  <script>
    let totalMinutes = 720;
    let isRealTimeMode = false;
    let realTimeInterval = null;
    let showDigital = true;

    const clockContainer = document.getElementById('clock-container');
    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const digitalText = document.getElementById('digital-text');

    // 文字盤（目盛り・時間の数字・分の数字）を配置
    function createDial() {
      const layer = document.getElementById('dial-layer');
      layer.innerHTML = '';
      
      const width = clockContainer.clientWidth;
      const centerX = width / 2;
      const centerY = width / 2;

      // 1. 60個の分刻み目盛りを生成
      for (let i = 0; i < 60; i++) {
        const tick = document.createElement('div');
        const isMajor = (i % 5 === 0);
        tick.className = `tick-mark ${isMajor ? 'major' : ''}`;
        
        const angle = i * 6; // 1刻み = 6度
        const radius = width * 0.46; // 外枠近くに配置

        // 角度と位置の設定
        tick.style.transform = `translate(-50%, -100%) rotate(${angle}deg) translateY(-${radius - 10}px)`;
        layer.appendChild(tick);
      }

      // 2. 時間の数字 (1〜12)
      const hourRadius = width * 0.32;
      for (let i = 1; i <= 12; i++) {
        const num = document.createElement('div');
        num.className = 'hour-number';
        num.textContent = i;
        
        const angle = (i * 30 - 90) * (Math.PI / 180);
        const x = centerX + hourRadius * Math.cos(angle);
        const y = centerY + hourRadius * Math.sin(angle);

        num.style.left = `${x}px`;
        num.style.top = `${y}px`;
        layer.appendChild(num);
      }

      // 3. 分の数字 (0, 5, 10, 15...55)
      const minuteRadius = width * 0.41;
      for (let i = 0; i < 60; i += 5) {
        const num = document.createElement('div');
        num.className = 'minute-number';
        num.textContent = i;
        
        const angle = (i * 6 - 90) * (Math.PI / 180);
        const x = centerX + minuteRadius * Math.cos(angle);
        const y = centerY + minuteRadius * Math.sin(angle);

        num.style.left = `${x}px`;
        num.style.top = `${y}px`;
        layer.appendChild(num);
      }
    }

    function updateClock() {
      totalMinutes = (totalMinutes % 720 + 720) % 720;

      const minutes = totalMinutes % 60;
      const hours = Math.floor(totalMinutes / 60) || 12;

      const minuteAngle = minutes * 6;
      const hourAngle = (totalMinutes % 720) * 0.5;

      minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;

      if (showDigital) {
        digitalText.textContent = `${hours}じ ${String(minutes).padStart(2, '0')}ふん`;
      } else {
        digitalText.textContent = `？？じ ？？ふん`;
      }
    }

    function addMinutes(mins) {
      stopRealTime();
      totalMinutes += mins;
      updateClock();
    }

    function setRealTime() {
      stopRealTime();
      isRealTimeMode = true;
      syncWithCurrentTime();
      realTimeInterval = setInterval(syncWithCurrentTime, 1000);
    }

    function syncWithCurrentTime() {
      const now = new Date();
      const h = now.getHours() % 12;
      const m = now.getMinutes();
      totalMinutes = h * 60 + m;
      updateClock();
    }

    function stopRealTime() {
      isRealTimeMode = false;
      if (realTimeInterval) clearInterval(realTimeInterval);
    }

    function toggleDigital() {
      showDigital = !showDigital;
      const btn = document.querySelector('.btn-toggle');
      btn.textContent = showDigital ? 'こたえを かくす' : 'こたえを みせる';
      updateClock();
    }

    let isDragging = false;

    function handlePointer(e) {
      if (!isDragging) return;
      e.preventDefault();
      stopRealTime();

      const rect = clockContainer.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let angle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI) + 90;
      if (angle < 0) angle += 360;

      const targetMinute = Math.round(angle / 6) % 60;
      const currentMinute = totalMinutes % 60;

      let diff = targetMinute - currentMinute;
      if (diff > 30) diff -= 60;
      if (diff < -30) diff += 60;

      totalMinutes += diff;
      updateClock();
    }

    clockContainer.addEventListener('pointerdown', (e) => {
      isDragging = true;
      clockContainer.setPointerCapture(e.pointerId);
      handlePointer(e);
    });

    clockContainer.addEventListener('pointermove', handlePointer);
    
    clockContainer.addEventListener('pointerup', (e) => {
      isDragging = false;
      clockContainer.releasePointerCapture(e.pointerId);
    });

    window.onload = () => {
      createDial();
      updateClock();
    };
  </script>
</body>
</html>
